  <ellipse cx="110" cy="176" rx="92" ry="24" fill="#9CCB86"/>
  <path d="M18 176 q92 92 184 0 z" fill="#B98A6A"/>
  <ellipse cx="110" cy="172" rx="78" ry="17" fill="#E9C9A0"/>
  <!-- стопка книг: цвета планет -->
  <rect x="44" y="150" width="54" height="11" rx="3" fill="#2F56A6"/>
  <rect x="48" y="139" width="50" height="11" rx="3" fill="#B53389"/>
