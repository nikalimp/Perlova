  <rect width="220" height="260" rx="24" fill="url(#sky)"/>
  <circle cx="168" cy="52" r="20" fill="#FFE7B8"/>
  <ellipse cx="62" cy="58" rx="22" ry="9" fill="#fff" opacity=".85"/><ellipse cx="78" cy="52" rx="14" ry="9" fill="#fff" opacity=".85"/>
